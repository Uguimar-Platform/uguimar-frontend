<button
  class="font-bold py-2 px-4 gap-2 transition duration-300 ease-in-out flex items-center justify-center"
  [ngClass]="[customClass()]">
  <mat-icon
    *ngIf="icon() && iconPosition() === 'left'"
    class="icon-left"
    [ngStyle]="{ color: iconColor() }">
    {{ icon() }}
  </mat-icon>

  <span [ngStyle]="{ color: textColor() }">
    {{ label() }}
  </span>

  <mat-icon
    *ngIf="icon() && iconPosition() === 'right'"
    class="icon-right"
    [ngStyle]="{ color: iconColor() }">
    {{ icon() }}
  </mat-icon>
</button>
