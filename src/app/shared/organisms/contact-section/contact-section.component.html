<div class="flex flex-col items-center justify-center">
  <label-atom
    text="Contacto"
    color="black"
    class="text-5xl font-bold text-black text-center">
  </label-atom>
  <div class="bg-[#5670CA] w-full max-w-full flex items-center justify-center">
    <div class="flex flex-col md:flex-row justify-center items-center gap-3">
      <div class="flex justify-center items-center">
        <img
          src="assets/images/Picturecontact-section.svg"
          alt="Contact us image"
          class="hidden sm:block w-100%" />
      </div>
      <div class="space-y-6 w-2/3 flex-col">
        <input-field-molecule
          label="Email"
          id="useremail"
          type="email"
          placeholder="Email"
          width="500px"
          class="w-full px-4 py-2 border:none rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400 br-50px text-white">
        </input-field-molecule>
        <input-field-molecule
          label="Message"
          color="white"
          id="usermessage"
          width="500px"
          height="100px"
          class="w-full h-32 px-4 py-2 border:none rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400 resize-none label-text-white br-50px">
        </input-field-molecule>
        <button-atom
          label="Enviar"
          customClass="w-full bg-[#334EAC] rounded-xl py-4">
        </button-atom>
      </div>

      <div class="w-1/3 flex justify-center items-center">
        <img
          src="assets/images/Picturecontact-section.svg"
          alt="Contact us image"
          class="w-500px block md:hidden" />
      </div>
    </div>
  </div>
</div>
