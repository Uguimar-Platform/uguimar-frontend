<div class="flex flex-col items-center justify-center p-6">
  <!--Div general de la sección de contacto-->
  <h1 class="text-xl font-bold text-black mb-2 w-100%">Contacto</h1>
  <!--Título de la sección de contacto, si no quieren con el h1 le puedes poner el atomo label-->
  <div class="bg-[#5670CA] w-full max-w-full flex items-center p-6">
    <!--Esta div lo cree para poner el flex y se ponga la imagen y el formulario en la misma linea-->

    <div class="w-1/3 flex justify-center items-center">
      <img
        src="assets/images/Picturecontact-section.svg"
        alt="Imagen de contáctanos"
        class="w-500px" />
      <!--Imagen de la sección de contacto-->
    </div>

    <!-- Formulario de contacto -->
    <div class="w-2/3 space-y-6">
      <!--Div del formulario de contacto   se encuentra el input que ya cuenta con un label y un placeholder y el botón de enviar-->

      <input-atom
        label="Correo"
        id="useremail"
        type="email"
        placeholder="Email"
        width="500px"
        class="w-full px-4 py-2 border:none rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400"></input-atom>

      <input-atom
        label="Mensaje"
        id="usermessage"
        placeholder="Ingrese el mensaje a enviar"
        width="500px"
        height="100px"
        class="w-full h-32 px-4 py-2 border:none rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400 resize-none"></input-atom>

      <!-- Botón de enviar -->
      <button-atom
        label="Enviar"
        class="w-100% py-3 bg-blue-700 text-white font-semibold rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-400"></button-atom>
    </div>
  </div>
</div>
