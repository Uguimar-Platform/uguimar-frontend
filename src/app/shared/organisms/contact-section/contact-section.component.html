<div class="flex flex-col items-center justify-center p-6">
  <h1 class="text-5xl font-bold text-black mb-6 w-full text-center">
    Contacto
  </h1>
  <div
    class="bg-[#5670CA] w-full max-w-full flex items-center justify-center p-6 pb-12">
    <div class="flex flex-col md:flex-row justify-center items-center">
      <div class="w-1/3 flex justify-center items-center">
        <img
          src="assets/images/Picturecontact-section.svg"
          alt="Imagen de contáctanos"
          class="w-500px hidden sm:block" />
      </div>

      <div class="w-2/3 space-y-6">
        <input-field-molecule
          label="Correo"
          id="useremail"
          type="email"
          placeholder="Email"
          width="500px"
          class="w-full px-4 py-2 border:none rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400"></input-field-molecule>

        <input-field-molecule
          label="Mensaje"
          id="usermessage"
          placeholder="Ingrese el mensaje a enviar"
          width="500px"
          height="100px"
          class="w-full h-32 px-4 py-2 border:none rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400 resize-none"></input-field-molecule>

        <button-atom
          label="Enviar"
          class="w-100% py-3 bg-blue-700 text-white font-semibold rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-400"></button-atom>
      </div>

      <div class="w-1/3 flex justify-center items-center">
        <img
          src="assets/images/Picturecontact-section.svg"
          alt="Imagen de contáctanos"
          class="w-500px block md:hidden" />
      </div>
    </div>
  </div>
</div>
