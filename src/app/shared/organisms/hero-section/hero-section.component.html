<section
  class="flex flex-row w-[1440px] m-auto gap-10 px-12 py-16 font-[SF_Pro_Display]">
  <div class="flex flex-col gap-6 max-w-[566px] text-left">
    <p
      class="relative w-[610px] h-[228px] text-[64px] text-5xl font-extrabold text-[#202020]">
      <label-atom class="" text="Aprende, crece y " />
      <label-atom
        class="absolute top-[65px]"
        color="blue-medium"
        text="destaca" />
      <label-atom class="absolute top-[65px] left-[247px]" text="con cursos" />
      <label-atom class="absolute top-[130px]" text=" transformadores" />
    </p>

    <p class="text-[24px] text-gray-600">
      Tu plataforma de aprendizaje: crece, explora y alcanza tus metas con
      cursos que transforman.
    </p>
    <div
      class="mt-6 flex gap-2 items-center bg-[#D0E3FF] rounded-full px-[8px] py-[6px] w-full mb-10">
      <button-atom
        customClass="rounded-xl bg-[#7096D1] hover:bg-[#005194]"
        icon="search"
        iconColor="#fff"
        (buttonClick)="clickSearch()" />
      <dynamic-select-atom
        class="w-full px-2 relative z-20"
        placeholder="¿Qué deseas aprender?"
        opacity="opacity-60"
        placeholderColor="placeholder-[#334EAC]"
        [handledClickSignal]="signalClickButton()"
        [arrayRoutes]="arrayRoutes" />
    </div>

    <button-atom
      customClass="bg-[#7096D1] rounded-full font-bolder w-[234px] h-[42px] hover:bg-[#005194]"
      icon="arrow_right_alt"
      iconPosition="right"
      iconColor="#fff"
      label="Empezar gratis"
      (buttonClick)="clickStartFree()" />
  </div>

  <div>
    <img
      [src]="images()[0]"
      alt="Grupo estudiando"
      class="left-24 w-[500px] h-[314px]" />
    <img
      [src]="images()[1]"
      alt="Estudiantes en el campus"
      class="left-48 top-14 w-[341px] h-[222px]" />
    <img
      [src]="images()[2]"
      alt="Estudiantes colaborando"
      class="-left-[150px] bottom-24 w-[278px] h-[185px]" />
  </div>
</section>
