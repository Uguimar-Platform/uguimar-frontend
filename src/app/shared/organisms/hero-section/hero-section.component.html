<section>
  <!--texto-->
  <div class="flex flex-col gap-6 max-w-[566px] text-left">
    <h1 class="text-[64px] text-5xl font-extrabold text-[#202020]">
      Aprende, crece y <span class="text-[#334EAC]">destaca</span> con cursos
      transformadores
    </h1>
    <p class="text-[24px] text-gray-600">
      Tu plataforma de aprendizaje: crece, explora y alcanza tus metas con
      cursos que transforman.
    </p>
    <!-- Input de búsqueda -->
    <div
      class="mt-6 flex gap-2 items-center bg-[#D0E3FF] rounded-full px-[8px] py-[6px] w-full mb-10">
      <!-- Icono de búsqueda -->
      <button-atom
        customClass="rounded-xl bg-[#7096D1] material-icons hover:bg-[#005194]"
        label="search" />
      <!-- Input -->
      <dynamic-select-atom
        class="w-full px-2"
        placeholder="¿Qué deseas aprender?"
        opacity="opacity-60"
        placeholderColor="placeholder-[#334EAC]"
        [arrayRoutes]="[]" />
    </div>

    <!-- Botón -->
    <button-atom
      customClass="bg-[#7096D1] rounded-full font-bolder w-[234px] h-[42px] hover:bg-[#005194]"
      label="Empezar gratis →" />
  </div>

  <div>
    <img src="/assets/images/image.png" alt="Grupo estudiando" />
    <img src="/assets/images/image2.png" alt="Estudiantes en el campus" />
    <img src="/assets/images/image3.png" alt="Estudiantes colaborando" />
  </div>
</section>
